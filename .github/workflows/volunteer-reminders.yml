name: Volunteer shift reminders

on:
  schedule:
    - cron: "0 0-6,22-23 * * *"
  workflow_dispatch:

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Send volunteer reminders
        env:
          SIGNUP_APP_URL: ${{ vars.SIGNUP_APP_URL }}
          REMINDER_JOB_TOKEN: ${{ secrets.REMINDER_JOB_TOKEN }}
        run: python scripts/send_shift_reminders.py
