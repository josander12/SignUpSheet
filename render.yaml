services:
  - type: web
    name: signup-sheet
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py app:app
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: DATABASE_PATH
        value: /var/data/volunteer_app.db
      - key: REMINDER_JOB_TOKEN
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: SMS_ALERT_PHONE
        sync: false
